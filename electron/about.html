<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
    <title>Acerca de</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #0f0f1a;
        color: #fff;
        font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        gap: 16px;
        user-select: none;
        -webkit-app-region: drag;
      }

      .icon {
        width: 64px;
        height: 64px;
        background: rgba(99, 102, 241, 0.15);
        border: 1px solid rgba(99, 102, 241, 0.3);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .icon svg {
        width: 36px;
        height: 36px;
        color: #818cf8;
        fill: currentColor;
      }

      h1 {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #fff;
      }

      .version {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.35);
      }

      hr {
        width: 60%;
        border: none;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }

      .description {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.45);
        text-align: center;
        line-height: 1.6;
        max-width: 260px;
      }

      .close-btn {
        -webkit-app-region: no-drag;
        margin-top: 8px;
        padding: 8px 28px;
        background: rgba(99, 102, 241, 0.15);
        border: 1px solid rgba(99, 102, 241, 0.3);
        border-radius: 8px;
        color: #a5b4fc;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
        font-family: inherit;
      }

      .close-btn:hover {
        background: rgba(99, 102, 241, 0.28);
        border-color: rgba(99, 102, 241, 0.5);
      }
    </style>
  </head>
  <body>
    <div class="icon">
      <svg viewBox="0 0 24 24">
        <path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z" />
      </svg>
    </div>

    <h1>Simple IPTV Player</h1>
    <span class="version" id="version">v0.0.1</span>

    <hr />

    <p class="description">Reproductor IPTV de escritorio. Soporta playlists M3U y streams HLS.</p>

    <button class="close-btn" onclick="window.close()">Cerrar</button>

    <script>
      // Inyectar versión desde el proceso main si está disponible
      if (typeof window.appVersion !== 'undefined') {
        document.getElementById('version').textContent = 'v' + window.appVersion;
      }
    </script>
  </body>
</html>
