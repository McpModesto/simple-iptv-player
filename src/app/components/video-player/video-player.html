<div
  class="video-player-container"
  (mousemove)="onMouseMove()"
  (mouseleave)="showControls.set(false)"
>
  @if (channel()) {
    <video
      #videoEl
      (play)="onPlay()"
      (pause)="onPause()"
      (waiting)="onWaiting()"
      (canplay)="onCanPlay()"
      (error)="onVideoError()"
      (dblclick)="toggleFullscreen()"
      autoplay
    ></video>

    <!-- Buffering spinner -->
    @if (isBuffering()) {
      <div class="overlay buffering">
        <div class="spinner"></div>
      </div>
    }

    <!-- Error message -->
    @if (errorMessage()) {
      <div class="overlay error">
        <svg viewBox="0 0 24 24" fill="currentColor" class="error-icon">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
        </svg>
        <p>{{ errorMessage() }}</p>
      </div>
    }

    <!-- Controls -->
    <div class="controls" [class.visible]="showControls()">
      <button class="control-btn" (click)="togglePlay()">
        @if (isPlaying()) {
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
        }
      </button>

      <div class="channel-now-playing">
        <span class="now-playing-name">{{ channel()?.name }}</span>
      </div>

      <div class="volume-control">
        <button class="control-btn" (click)="toggleMute()">
          @if (isMuted() || currentVolume() === 0) {
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
          }
        </button>
        <input
          type="range"
          min="0"
          max="100"
          [value]="currentVolume()"
          (input)="onVolumeChange($event)"
          class="volume-slider"
        />
      </div>

      <button class="control-btn" (click)="toggleFullscreen()">
        @if (isFullscreen()) {
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
          </svg>
        }
      </button>
    </div>
  } @else {
    <!-- Empty state -->
    <div class="overlay empty-state">
      <svg viewBox="0 0 24 24" fill="currentColor" class="empty-icon">
        <path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/>
      </svg>
      <p>Selecciona un canal para empezar</p>
    </div>
  }
</div>
