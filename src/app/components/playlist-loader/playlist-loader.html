@if (showModal()) {
<div class="modal-backdrop" (click)="onBackdropClick($event)">
  <div class="modal">
    <div class="modal-header">
      <h2>{{ i18n.t().modalTitle }}</h2>
      <button class="close-btn" (click)="close()">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
        </svg>
      </button>
    </div>

    <div class="modal-body">
      <!-- Saved playlists -->
      @if (storage.savedPlaylists().length > 0) {
      <div class="input-section">
        <label class="input-label">{{ i18n.t().savedPlaylists }}</label>
        <div class="saved-list">
          @for (saved of storage.savedPlaylists(); track saved.id) {
          <button class="saved-item" (click)="loadSaved(saved.id)" [disabled]="isLoading()">
            <div class="saved-icon">
              @if (saved.source === 'url') {
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z" />
              </svg>
              } @else {
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z" />
              </svg>
              }
            </div>
            <div class="saved-info">
              <span class="saved-name">{{ saved.name }}</span>
              <span class="saved-meta">{{ saved.channelCount }} {{ i18n.t().channels }} · {{ saved.source === 'url' ? i18n.t().sourceUrl : i18n.t().sourceFile
                }}</span>
            </div>
            <button class="saved-delete" (click)="removeSaved($event, saved.id)" title="Eliminar">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" />
              </svg>
            </button>
          </button>
          }
        </div>
      </div>

      <div class="divider">
        <span>{{ i18n.t().orAddNew }}</span>
      </div>
      }

      <!-- Playlist name -->
      <div class="input-section">
        <label class="input-label">{{ i18n.t().playlistName }}</label>
        <input type="text" [placeholder]="i18n.t().playlistNamePlaceholder" class="url-input name-input" [(ngModel)]="customName" />
      </div>

      <div class="name-spacer"></div>

      <!-- URL input -->
      <div class="input-section">
        <label class="input-label">{{ i18n.t().fromUrl }}</label>
        <div class="url-input-group">
          <input type="url" [placeholder]="i18n.t().urlPlaceholder" class="url-input" [(ngModel)]="url"
            (keydown.enter)="loadUrl()" />
          <button class="load-btn" (click)="loadUrl()" [disabled]="isLoading()">
            @if (isLoading()) {
            <div class="btn-spinner"></div>
            } @else {
            {{ i18n.t().load }}
            }
          </button>
        </div>
      </div>

      <div class="divider">
        <span>{{ i18n.t().or }}</span>
      </div>

      <!-- File input -->
      <div class="input-section">
        <label class="input-label">{{ i18n.t().fromFile }}</label>
        <label class="file-drop">
          <input type="file" accept=".m3u,.m3u8,.txt" (change)="onFileSelected($event)" hidden />
          <svg viewBox="0 0 24 24" fill="currentColor" class="upload-icon">
            <path
              d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z" />
          </svg>
          <span>{{ i18n.t().fileDropText }}</span>
        </label>
      </div>

      @if (error()) {
      <div class="error-msg">{{ error() }}</div>
      }
    </div>
  </div>
</div>
}
