<div class="app-layout">
  <!-- Sidebar -->
  <aside class="sidebar" [class.collapsed]="sidebarCollapsed()">
    <div class="sidebar-header">
      @if (!sidebarCollapsed()) {
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="currentColor" class="logo-icon">
            <path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/>
          </svg>
          <span class="logo-text">IPTV Player</span>
        </div>
      }
      <button class="icon-btn" (click)="toggleSidebar()" title="Toggle sidebar">
        @if (sidebarCollapsed()) {
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
          </svg>
        }
      </button>
    </div>

    @if (!sidebarCollapsed()) {
      <!-- Add playlist button -->
      <div class="sidebar-actions">
        <button class="add-playlist-btn" (click)="openPlaylistLoader()">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
          </svg>
          Cargar Playlist
        </button>
      </div>

      @if (playlist.channels().length > 0) {
        <div class="playlist-info">
          <span class="playlist-name">{{ playlist.playlistName() }}</span>
          <span class="channel-count">{{ playlist.channels().length }} canales</span>
        </div>
        <app-channel-list (channelSelected)="onChannelSelected($event)" />
      } @else {
        <div class="sidebar-empty">
          <svg viewBox="0 0 24 24" fill="currentColor" class="empty-icon">
            <path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9h-4v4h-2v-4H9V9h4V5h2v4h4v2z"/>
          </svg>
          <p>Carga una playlist M3U para empezar</p>
        </div>
      }
    }
  </aside>

  <!-- Main content -->
  <main class="main-content">
    <app-video-player [channel]="currentChannel()" />
  </main>
</div>

<app-playlist-loader #loader />
